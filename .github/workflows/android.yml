name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | Tee-Object -FilePath gradle-test-output.log
          exit $LASTEXITCODE

      - name: Summarize unit test failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $summaryLines = @("# Unit test failure summary", "")
          if (Test-Path gradle-test-output.log) {
            $tail = (Get-Content gradle-test-output.log -Tail 160) -join "`n"
            $message = ($tail -replace "`r?`n", "%0A")
            Write-Output "::error title=Gradle unit test failure::$message"
            $summaryLines += "## Gradle output tail"
            $summaryLines += '```text'
            $summaryLines += $tail
            $summaryLines += '```'
          }

          $xmlFiles = Get-ChildItem app/build/test-results/testDebugUnitTest -Filter "TEST-*.xml" -ErrorAction SilentlyContinue
          foreach ($file in $xmlFiles) {
            [xml]$xml = Get-Content $file.FullName
            foreach ($case in $xml.testsuite.testcase) {
              if ($case.failure -or $case.error) {
                $problem = if ($case.failure) { $case.failure } else { $case.error }
                $className = $case.classname
                $testName = $case.name
                $details = (($problem.message, $problem.'#text') -join "`n").Trim()
                $details = ($details -replace "`r?`n", "%0A")
                Write-Output "::error file=$($file.FullName),title=$className.$testName::$details"
                $summaryLines += ""
                $summaryLines += "## $className.$testName"
                $summaryLines += '```text'
                $summaryLines += (($problem.message, $problem.'#text') -join "`n").Trim()
                $summaryLines += '```'
              }
            }
          }

          if ($summaryLines.Count -le 2) {
            $summaryLines += "No JUnit XML failure entries were found. The failure likely happened before tests executed."
          }

          $summaryLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build installable APK
        run: .\gradlew.bat --no-daemon :app:assembleDebug

      - name: Locate APK
        id: apk
        shell: pwsh
        run: |
          $gradle = Get-Content app/build.gradle.kts -Raw
          $versionName = [regex]::Match($gradle, 'versionName\s*=\s*"([^"]+)"').Groups[1].Value
          $versionCode = [int][regex]::Match($gradle, 'versionCode\s*=\s*(\d+)').Groups[1].Value
          if (-not $versionName -or $versionCode -le 0) {
            throw "Unable to read application version from app/build.gradle.kts"
          }
          $version = "v$versionName.$($versionCode.ToString('0000'))"
          $apkName = "PocketSSH-$version.apk"
          $sourceApk = Get-ChildItem app/build/outputs/apk/debug -Recurse -Filter *.apk | Select-Object -First 1
          if (-not $sourceApk) {
            throw "Generated APK was not found"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $version) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match application version $version"
          }
          $releaseDir = Join-Path $env:RUNNER_TEMP "pocketssh-release"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          $apkPath = Join-Path $releaseDir $apkName
          Copy-Item $sourceApk.FullName $apkPath
          "path=$apkPath" >> $env:GITHUB_OUTPUT
          "name=$apkName" >> $env:GITHUB_OUTPUT

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
