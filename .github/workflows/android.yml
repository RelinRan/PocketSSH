name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: .\gradlew.bat --no-daemon :app:testDebugUnitTest

      - name: Build installable APK
        run: .\gradlew.bat --no-daemon :app:assembleDebug

      - name: Locate APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem app/build/outputs/apk/debug/PocketSSH-v*.apk | Select-Object -First 1
          if (-not $apk) {
            throw "Generated PocketSSH APK was not found"
          fi
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $apk.Name -ne "PocketSSH-$($env:GITHUB_REF_NAME).apk") {
            throw "Tag $($env:GITHUB_REF_NAME) does not match generated APK $($apk.Name)"
          }
          "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($apk.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
