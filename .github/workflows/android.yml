name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build installable APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -name 'PocketSSH-v*.apk' -print -quit)"
          test -n "$APK_PATH"
          APK_NAME="$(basename "$APK_PATH")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$APK_NAME" != "PocketSSH-${GITHUB_REF_NAME}.apk" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match generated APK $APK_NAME" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
